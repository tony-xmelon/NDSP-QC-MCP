[package]
name = "qc-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Authenticated remote relay for QC Control devices"

[dependencies]
qc-relay-protocol = { path = "../../packages/rust/qc-relay-protocol" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
http = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
