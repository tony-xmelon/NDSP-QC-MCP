[package]
name = "qc-remote-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Authenticated public MCP and Android relay composition for QC Control"

[dependencies]
async-trait = "0.1"
axum = "0.8"
qc-relay = { path = "../qc-relay" }
qc-remote-mcp = { path = "../rust-mcp" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
