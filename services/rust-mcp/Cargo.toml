[package]
name = "qc-remote-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Authenticated-composable remote MCP surface for NDSP Quad Cortex control"

[dependencies]
async-trait = "0.1"
axum = "0.8"
rmcp = { version = "3.2", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

