name: Software parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: software-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-parity:
    name: Shared contracts, apps, and native runtimes
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/software-parity-target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify shared contracts, apps, and native runtimes
        run: npm run test:parity:software

  ui-conformance:
    name: Responsive and accessible app surfaces
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install browser for responsive and accessibility checks
        run: npx playwright install chromium

      - name: Verify responsive layouts and accessibility
        run: npm run test:ui

      - name: Preserve failed UI screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  android-package:
    name: Android APK and native Rust libraries
    needs: [software-parity, ui-conformance]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust/*/target
          key: ${{ runner.os }}-android-rust-${{ hashFiles('packages/rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-rust-

      - name: Install pinned Android build tools
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Android APK with shared Rust runtime
        run: npm run android:build:debug

      - name: Preserve APK and release provenance
        uses: actions/upload-artifact@v4
        with:
          name: qc-control-android-${{ github.sha }}
          path: |
            artifacts/android/QC-Control-Android-*.apk
            artifacts/android/QC-Control-Android-*.apk.source.json
            artifacts/release-manifest.json
            artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Windows installer and native Rust broker
    needs: [software-parity, ui-conformance]
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/QCControlBuild/cargo-target
          key: ${{ runner.os }}-windows-installer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-installer-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Windows installer from the parity-approved commit
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -SkipPreflight

      - name: Preserve installer and release provenance
        uses: actions/upload-artifact@v4
        with:
          name: qc-control-windows-${{ github.sha }}
          path: |
            artifacts/windows/QC-Control-Windows-*.exe
            artifacts/windows/QC-Control-Windows-*.exe.source.json
            artifacts/release-manifest.json
            artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Same-commit Windows and Android release bundle
    needs: [android-package, windows-package]
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the parity-approved Android candidate
        uses: actions/download-artifact@v4
        with:
          name: qc-control-android-${{ github.sha }}
          path: artifacts

      - name: Download the parity-approved Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: qc-control-windows-${{ github.sha }}
          path: artifacts

      - name: Regenerate and verify combined release provenance
        shell: pwsh
        run: |
          $windows = @(Get-ChildItem artifacts/windows/QC-Control-Windows-*.exe -File | ForEach-Object FullName)
          $android = @(Get-ChildItem artifacts/android/QC-Control-Android-*.apk -File | ForEach-Object FullName)
          if ($windows.Count -ne 1 -or $android.Count -ne 1) { throw "Combined release bundle requires exactly one Windows and one Android candidate." }
          node tools/release-provenance.mjs $windows[0] $android[0]
          node tools/release-candidates.mjs verify

      - name: Preserve the hardware-testable cross-platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: qc-control-release-bundle-${{ github.sha }}
          path: |
            artifacts/windows/QC-Control-Windows-*.exe
            artifacts/windows/QC-Control-Windows-*.exe.source.json
            artifacts/android/QC-Control-Android-*.apk
            artifacts/android/QC-Control-Android-*.apk.source.json
            artifacts/release-manifest.json
            artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
