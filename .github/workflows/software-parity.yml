name: Software parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: software-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-parity:
    name: Shared contracts, apps, and native runtimes
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust/*/target
            services/*/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify shared contracts, apps, and native runtimes
        run: npm run test:parity:software

  ui-conformance:
    name: Responsive and accessible app surfaces
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install browser for responsive and accessibility checks
        run: npx playwright install chromium

      - name: Verify responsive layouts and accessibility
        run: npm run test:ui

      - name: Preserve failed UI screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
